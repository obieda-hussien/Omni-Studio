name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release build
    # Keep the release lane on the validated LTS image. ubuntu-latest moves
    # to 26.04 starting 2026-10-19; adopt it through a separate tested upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Temporary maintenance bootstrap. The generated snapshot is reviewed and committed,
      # then this step is removed so normal CI stays fully offline/deterministic.
      - name: Refresh dependency freshness evidence
        run: python scripts/refresh_dependency_freshness.py --reviewed-on 2026-10-01

      - name: Unit tests
        run: ./gradlew :app:testQaUnitTest --stacktrace

      - name: Show dependency freshness diff
        if: always()
        run: git diff -- scripts/dependency_freshness_snapshot.json || true

      - name: Compile UI regression tests
        run: ./gradlew :app:compileQaAndroidTestKotlin --stacktrace

      - name: Lint release
        run: ./gradlew :app:lintRelease -Pomni.ciUnsignedRelease=true --stacktrace

      - name: Assemble optimized release APKs
        run: ./gradlew :app:assembleRelease -Pomni.ciUnsignedRelease=true --stacktrace

      - name: Build release app bundle
        run: ./gradlew :app:bundleRelease -Pomni.ciUnsignedRelease=true --stacktrace

      - name: Write CI release notice
        run: |
          mkdir -p app/build/outputs/ci-release
          cat > app/build/outputs/ci-release/README.txt <<'EOF'
          Omni Studio CI release artifacts
          =================================

          These are minified/shrunk Android RELEASE builds.
          They are intentionally unsigned when the repository's pinned production keystore is not available in CI.
          Sign them with the approved Omni Studio/legacy-lineage release key before installation or distribution.
          CI never falls back to the Android debug signing key.
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: omni-studio-ci-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/**
            app/build/test-results/**

      # Each upload creates its own downloadable ZIP. Keep ABI APKs and the
      # Play bundle separate so installing one build never requires all of them.
      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v6
        with:
          name: omni-studio-apk-arm64-v8a-release-unsigned
          if-no-files-found: error
          path: app/build/outputs/apk/release/*-arm64-v8a-*.apk

      - name: Upload ARM32 release APK
        uses: actions/upload-artifact@v6
        with:
          name: omni-studio-apk-armeabi-v7a-release-unsigned
          if-no-files-found: error
          path: app/build/outputs/apk/release/*-armeabi-v7a-*.apk

      - name: Upload x86 release APK
        uses: actions/upload-artifact@v6
        with:
          name: omni-studio-apk-x86-release-unsigned
          if-no-files-found: error
          path: app/build/outputs/apk/release/*-x86-*.apk

      - name: Upload x86_64 release APK
        uses: actions/upload-artifact@v6
        with:
          name: omni-studio-apk-x86_64-release-unsigned
          if-no-files-found: error
          path: app/build/outputs/apk/release/*-x86_64-*.apk

      - name: Upload universal release APK
        uses: actions/upload-artifact@v6
        with:
          name: omni-studio-apk-universal-release-unsigned
          if-no-files-found: error
          path: app/build/outputs/apk/release/*-universal-*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v6
        with:
          name: omni-studio-aab-release-unsigned
          if-no-files-found: error
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload release signing notice
        uses: actions/upload-artifact@v6
        with:
          name: omni-studio-release-signing-notice
          if-no-files-found: error
          path: app/build/outputs/ci-release/README.txt
